name: release

# Run by hand on main with the version; the release tag v<version> is created from main.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, x.y.z
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # agshell-vt.dll, the live daemon's terminal state, builds with the Zig that ghostty pins.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: agshell-vt
        shell: pwsh
        run: ./scripts/build-agshell-vt.ps1
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./scripts/release.ps1 -Version $env:RELEASE_VERSION -Publish -Repository MelfisDrake/AgShell
      - name: Upload release test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/release-diagnostics/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: agshell-${{ inputs.version }}
          path: |
            dist/*.zip
            dist/*-setup.exe
